[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayorai"
version = "0.2.0"
description = "Agentic AI and AI Safety engineering framework"
readme = "README.md"
authors = [{name = "Anderson Leon Ayora"}]
keywords = ["ai-safety", "agents", "mcp", "prompt-injection", "llm-security", "rag", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
]

license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ayorinha/ayorai"
Repository = "https://github.com/Ayorinha/ayorai"
Issues = "https://github.com/Ayorinha/ayorai/issues"
Documentation = "https://github.com/Ayorinha/ayorai/tree/main/docs"
Security = "https://github.com/Ayorinha/ayorai/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/ayorai"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
